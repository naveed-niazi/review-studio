name: Feature request
description: Suggest an improvement to the local review workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe the workflow and any alternatives you considered.
    validations:
      required: true
