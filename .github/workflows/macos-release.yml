name: macOS build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/macos-release.yml'
      - 'desktop/**'
      - 'server/**'
      - 'src/**'
      - 'scripts/**'
      - 'test/desktop-check.mjs'
      - 'package*.json'
      - 'vite.config.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: Build and verify macOS installer
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Validate release source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {validateReleaseRef} from './scripts/publish-release.mjs'; validateReleaseRef(JSON.parse(readFileSync('package.json')).version, process.env.GITHUB_REF);"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci
      - run: npm run format:check
      - run: npm run audit:release
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm audit --omit=dev
      - name: Package unsigned preview
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged lifecycle with isolated accounts
        run: node test/desktop-check.mjs
      - name: Audit package and verify disk image
        run: npm run verify:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-studio-macos-arm64-${{ github.sha }}
          path: |
            release/Review-Studio-*-arm64.dmg
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  release:
    name: Publish verified preview
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-studio-macos-arm64-${{ github.sha }}
          path: release
      - name: Verify downloaded artifact
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Review-Studio-*-arm64.dmg
      - name: Publish release without replacing published versions
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
